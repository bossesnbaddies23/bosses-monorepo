services:
  - type: web
    name: ai-boo-monorepo
    env: node
    rootDir: .
    buildCommand: npm install --legacy-peer-deps && npm run build:ai-boo
    startCommand: npm run start:ai-boo
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: NODE_ENV
        value: production
